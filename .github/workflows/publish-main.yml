name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [ main, dev ]

concurrency:
  # head_ref (PR) and ref_name (push) resolve to the same branch name, so the
  # PR run supersedes the duplicate push run for the same commit.
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'dev' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wrangleworks/wrangles

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      push_image: ${{ steps.resolve.outputs.push_image }}
      run_build: ${{ steps.resolve.outputs.run_build }}
    steps:
      - id: resolve
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          FULL=false
          [[ "$GITHUB_REF_NAME" == "main" || "$BASE_REF" == "main" ]] && FULL=true
          if [[ "$FULL" == "true" ]]; then
            echo 'matrix={"os":["ubuntu-latest","windows-latest"],"python-version":["3.11","3.13"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"os":["ubuntu-latest"],"python-version":["3.11"]}' >> "$GITHUB_OUTPUT"
          fi

          IMAGE_TAG=""
          PUSH_IMAGE=false
          RUN_BUILD=false

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            RUN_BUILD=true
            if [[ "$BASE_REF" == "main" ]]; then
              IMAGE_TAG="latest"
            elif [[ "$BASE_REF" == "dev" ]]; then
              IMAGE_TAG="dev"
            fi
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_REF_NAME" == "main" ]]; then
              IMAGE_TAG="latest"
              PUSH_IMAGE=true
              RUN_BUILD=true
            elif [[ "$GITHUB_REF_NAME" == "dev" ]]; then
              IMAGE_TAG="dev"
              PUSH_IMAGE=true
              RUN_BUILD=true
            fi
          fi

          # Local-only tag when building without pushing (PRs).
          if [[ "$RUN_BUILD" == "true" && "$PUSH_IMAGE" == "false" ]]; then
            IMAGE_TAG="ci-${GITHUB_SHA}"
          fi

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "push_image=${PUSH_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "run_build=${RUN_BUILD}" >> "$GITHUB_OUTPUT"

  pytest:
    needs: [config]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==9.0.2 lorem pytest-mock
          pip install -r requirements-full.txt
          pip install .

      - name: Run Tests
        run: pytest
        env:
          WRANGLES_USER: ${{ secrets.WRANGLES_USER }}
          WRANGLES_PASSWORD: ${{ secrets.WRANGLES_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  test-pip-install:
    needs: [config]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test pip install
        run: |
          python -m pip install --upgrade pip
          pip install .
          wrangles.recipe tests/samples/generate-data.wrgl.yml

  test-generate-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements-full.txt
          pip install jsonschema

      - name: Generate and Test Schema
        run: cd schema && python generate_recipe_schema.py

      - name: Save Schema as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: schema
          path: schema/schema.json

  build:
    runs-on: ubuntu-latest
    needs: [config, pytest, test-pip-install, test-generate-schema]
    if: needs.config.outputs.run_build == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      # Login against a Docker registry only when pushing
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: needs.config.outputs.push_image == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx (don't push on PR / feature branches)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ needs.config.outputs.push_image == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.config.outputs.image_tag }}
          labels: ${{ steps.meta.outputs.labels }}

  test-container:
    runs-on: ubuntu-latest
    if: needs.config.outputs.push_image == 'true'
    needs: [config, build]
    container:
      image: ghcr.io/wrangleworks/wrangles:${{ needs.config.outputs.image_tag }}
    env:
      WRANGLES_USER: ${{ secrets.WRANGLES_USER }}
      WRANGLES_PASSWORD: ${{ secrets.WRANGLES_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Remove wrangles folder
        run: rm -r wrangles

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==9.0.2 lorem pytest-mock

      - name: Run Tests
        run: pytest

      - name: Run Recipe (Remote)
        run: wrangles.recipe 42f319a8-0849-4177

      - name: Run Recipe (Local)
        run: >-
          cd tests/samples
          && wrangles.recipe recipe-basic.wrgl.yml
          && wrangles.recipe recipe_custom_function.wrgl.yml -f custom_functions.py
