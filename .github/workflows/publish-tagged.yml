name: Deploy Prod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: 'Publish the release to PyPI'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wrangleworks/wrangles

jobs:
  # ── Validate the tag and the publishing configuration ────────────────────
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Validate tag matches setup.py version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SETUP_VERSION=$(sed -n "s/^[[:space:]]*version[[:space:]]*=[[:space:]]*'\([^']*\)'.*/\1/p" setup.py)
          if [[ -z "$SETUP_VERSION" ]]; then
            echo "::error::Could not read the version from setup.py."
            exit 1
          fi
          if [[ "$VERSION" != "$SETUP_VERSION" ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' resolves to version '${VERSION}' but setup.py declares '${SETUP_VERSION}'. Bump setup.py to match the tag before releasing."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${VERSION}"

      - name: Validate required GitHub Variables
        env:
          AWS_PUBLISH_ROLE_ARN: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          CODEARTIFACT_DOMAIN: ${{ vars.CODEARTIFACT_DOMAIN }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}
          CODEARTIFACT_REPOSITORY: ${{ vars.CODEARTIFACT_REPOSITORY }}
        run: |
          MISSING=()
          [[ -z "$AWS_PUBLISH_ROLE_ARN"      ]] && MISSING+=(AWS_PUBLISH_ROLE_ARN)
          [[ -z "$AWS_REGION"                ]] && MISSING+=(AWS_REGION)
          [[ -z "$CODEARTIFACT_DOMAIN"       ]] && MISSING+=(CODEARTIFACT_DOMAIN)
          [[ -z "$CODEARTIFACT_DOMAIN_OWNER" ]] && MISSING+=(CODEARTIFACT_DOMAIN_OWNER)
          [[ -z "$CODEARTIFACT_REPOSITORY"   ]] && MISSING+=(CODEARTIFACT_REPOSITORY)
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "::error::The following GitHub Actions Variables are not set: ${MISSING[*]}"
            exit 1
          fi

  pytest:
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==9.0.2 lorem pytest-mock
          pip install -r requirements.txt
          pip install .
          
      - name: Run Tests
        run: pytest
        env:
          WRANGLES_USER: ${{ secrets.WRANGLES_USER }}
          WRANGLES_PASSWORD: ${{ secrets.WRANGLES_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JINAAI_API_KEY: ${{ secrets.JINAAI_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  test-pip-install:
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Test pip install
        run: |
          python -m pip install --upgrade pip
          pip install .
          wrangles.recipe tests/samples/generate-data.wrgl.yml

  pytest-macos:
    runs-on: macos-latest
    needs: [validate]
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          brew update
          brew install freetds
          python -m pip install --upgrade pip
          pip install pytest==9.0.2 lorem pytest-mock
          pip install -r requirements.txt
          pip install .

      - name: Run Tests
        run: pytest
        env:
          WRANGLES_USER: ${{ secrets.WRANGLES_USER }}
          WRANGLES_PASSWORD: ${{ secrets.WRANGLES_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  test-generate-schema:
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install jsonschema

      - name: Generate and Test Schema
        run: cd schema && python generate_recipe_schema.py

      - name: Save Schema as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: schema
          path: schema/schema.json

  build:
    runs-on: ubuntu-latest
    needs: [validate, pytest, test-pip-install, pytest-macos, test-generate-schema]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      # Login against a Docker registry
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}

  test-container:
    name: Test Container
    runs-on: ubuntu-latest
    needs: [validate, build]
    container:
      image: ghcr.io/wrangleworks/wrangles:${{ needs.validate.outputs.version }}
    env:
      WRANGLES_USER: ${{ secrets.WRANGLES_USER }}
      WRANGLES_PASSWORD: ${{ secrets.WRANGLES_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Remove wrangles folder
        run: rm -r wrangles

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==9.0.2 lorem pytest-mock

      - name: Run Tests
        run: pytest

      - name: Run Recipe (Remote)
        run: wrangles.recipe 42f319a8-0849-4177

      - name: Run Recipe (Local)
        run: >-
          cd tests/samples
          && wrangles.recipe recipe-basic.wrgl.yml
          && wrangles.recipe recipe_custom_function.wrgl.yml -f custom_functions.py

  # ── Build the distributions once so both registries get identical files ──
  build-dist:
    name: Build Distributions
    runs-on: ubuntu-latest
    needs: [validate, pytest, test-pip-install, pytest-macos, test-generate-schema]
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install build --user

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel --outdir dist/ .

      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  # ── Publish to CodeArtifact ──────────────────────────────────────────────
  # Runs before PyPI: CodeArtifact rejects a version that already exists in a
  # reachable external repository, so publishing here first avoids a conflict.
  #
  # Gated on test-container so a failing image blocks the package release
  # instead of letting the two artifacts diverge. Everything from this job
  # release that fails partway through.
  publish-codeartifact:
    name: Publish to CodeArtifact
    runs-on: ubuntu-latest
    needs: [validate, build-dist, test-container]
    permissions:
      contents: read
      id-token: write   # required for OIDC AssumeRoleWithWebIdentity
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install twine
        run: python -m pip install twine --user

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to CodeArtifact (twine)
        run: |
          aws codeartifact login --tool twine \
            --domain ${{ vars.CODEARTIFACT_DOMAIN }} \
            --domain-owner ${{ vars.CODEARTIFACT_DOMAIN_OWNER }} \
            --repository ${{ vars.CODEARTIFACT_REPOSITORY }}

      # --skip-existing keeps re-runs safe after a partial release: CodeArtifact
      # answers 409 for an asset that is already stored, which twine treats as
      # "already published" rather than a failure.
      - name: Publish to CodeArtifact
        run: twine upload --skip-existing --repository codeartifact dist/*

      # CodeArtifact persists package versions asynchronously, so a successful
      # upload is not proof the version is available to consumers yet.
      - name: Validate package publication
        run: |
          for i in $(seq 1 20); do
            STATUS=$(aws codeartifact describe-package-version \
              --domain ${{ vars.CODEARTIFACT_DOMAIN }} \
              --domain-owner ${{ vars.CODEARTIFACT_DOMAIN_OWNER }} \
              --repository ${{ vars.CODEARTIFACT_REPOSITORY }} \
              --format pypi --package wrangles --package-version "$VERSION" \
              --query 'packageVersion.status' --output text 2>/dev/null) || STATUS=""
            if [[ "$STATUS" == "Published" ]]; then
              echo "wrangles ${VERSION} is available in ${{ vars.CODEARTIFACT_REPOSITORY }}."
              exit 0
            fi
            echo "Attempt ${i}/20: status='${STATUS:-not found}', retrying in 15s."
            sleep 15
          done
          echo "::error::wrangles ${VERSION} is not visible in ${{ vars.CODEARTIFACT_REPOSITORY }} after 5 minutes."
          exit 1

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [publish-codeartifact]
    # Tag pushes always publish to PyPI. Manual runs only publish when the
    # publish_pypi input is explicitly enabled (defaults to false).
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_pypi }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Allows the job to be re-run after a partial release. A version can
          # never be replaced on PyPI, so a bad publish is fixed by releasing a
          # new version, not by re-running this job.
          skip-existing: true

  # ── Trigger PROD deployment in Lambda-Recipes ─────────────────────────────
  # Runs after publish-pypi (or when skipped) because Lambda-Recipes verify-setup
  # requires the version to exist on PyPI before the deploy pipeline starts.
  # CROSS_REPO_PAT: GitHub PAT with Actions read/write on Lambda-Recipes.
  trigger-deploy-prod:
    name: Trigger PROD Deploy
    runs-on: ubuntu-latest
    needs: [validate, publish-codeartifact, publish-pypi]
    if: >-
      needs.validate.result == 'success' &&
      needs.publish-codeartifact.result == 'success' &&
      (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
    steps:
      - name: Record deploy attribution
        run: |
          {
            echo "## PROD deploy attribution"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **deploy_user** | \`${{ github.actor }}\` |"
            echo "| **wrangles_version** | \`${{ needs.validate.outputs.version }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Lambda-Recipes dispatch payload
        id: dispatch
        env:
          WRANGLES_VERSION: ${{ needs.validate.outputs.version }}
          DEPLOY_USER: ${{ github.actor }}
        run: |
          if [ -z "$DEPLOY_USER" ]; then
            echo "::error::deploy_user is empty"
            exit 1
          fi
          payload=$(jq -n \
            --arg wrangles_version "$WRANGLES_VERSION" \
            --arg deploy_user "$DEPLOY_USER" \
            '{wrangles_version: $wrangles_version, deploy_user: $deploy_user}')
          echo "payload=$payload" >> "$GITHUB_OUTPUT"

      - name: Deploy Prod
        uses: convictional/trigger-workflow-and-wait@v1.6.5
        with:
          owner: wrangleworks
          repo: Lambda-Recipes
          workflow_file_name: deploy-prod.yml
          github_token: ${{ secrets.CROSS_REPO_PAT }}
          ref: main
          wait_interval: 15
          client_payload: ${{ steps.dispatch.outputs.payload }}
          propagate_failure: true
          trigger_workflow: true
          wait_workflow: true

