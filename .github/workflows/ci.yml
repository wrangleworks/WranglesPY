name: CI

on:
  # Push is limited to the branches that publish an image. A branch with an open
  # PR in this repo would otherwise produce a push run and a pull_request run for
  # the same commit, and the two would cancel each other out of the concurrency
  # group below. Feature branches are covered by their pull_request run.
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  # Pushes to main/dev publish and promote :latest / :dev, so they must always
  # finish. Only superseded PR runs are safe to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wrangleworks/wrangles

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      build_tag: ${{ steps.resolve.outputs.build_tag }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      push_image: ${{ steps.resolve.outputs.push_image }}
      run_build: ${{ steps.resolve.outputs.run_build }}
    steps:
      - id: resolve
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          FULL=false
          [[ "$GITHUB_REF_NAME" == "main" || "$BASE_REF" == "main" ]] && FULL=true
          if [[ "$FULL" == "true" ]]; then
            echo 'matrix={"os":["ubuntu-latest","windows-latest"],"python-version":["3.11","3.13","3.14"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"os":["ubuntu-latest"],"python-version":["3.11"]}' >> "$GITHUB_OUTPUT"
          fi

          RELEASE_TAG=""
          PUSH_IMAGE=false
          RUN_BUILD=false

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            RUN_BUILD=true
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_REF_NAME" == "main" ]]; then
              RELEASE_TAG="latest"
              PUSH_IMAGE=true
              RUN_BUILD=true
            elif [[ "$GITHUB_REF_NAME" == "dev" ]]; then
              RELEASE_TAG="dev"
              PUSH_IMAGE=true
              RUN_BUILD=true
            fi
          fi

          # Pushes land on an immutable per-commit tag. The mutable test-image tag
          # (dev / latest) is only moved onto that image once test-container
          # passes, so validation jobs never resolve it to an untested build.
          if [[ "$PUSH_IMAGE" == "true" ]]; then
            BUILD_TAG="sha-${GITHUB_SHA}"
          else
            BUILD_TAG="ci-${GITHUB_SHA}"
          fi

          echo "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "push_image=${PUSH_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "run_build=${RUN_BUILD}" >> "$GITHUB_OUTPUT"

  pytest:
    needs: [config]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==9.0.2 lorem pytest-mock jsonschema==4.26.0
          pip install -r requirements-full.txt
          pip install .

      - name: Run Tests
        run: pytest
        env:
          WRANGLES_USER: ${{ secrets.WRANGLES_USER }}
          WRANGLES_PASSWORD: ${{ secrets.WRANGLES_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  test-pip-install:
    needs: [config]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test pip install
        run: |
          python -m pip install --upgrade pip
          pip install .
          wrangles.recipe tests/samples/generate-data.wrgl.yml

  test-generate-schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements-full.txt jsonschema pytest

      - name: Generate and Test Schema
        run: cd schema && python generate_recipe_schema.py

      - name: Test runtime manifest
        run: python -m pytest tests/test_wrangle_runtime_manifest.py -q

      - name: Export validated runtime manifest
        run: |
          python schema/generate_wrangle_manifest.py --source-revision "$GITHUB_SHA" --artifact-dir "$RUNNER_TEMP/runtime-manifest"
          cp "$RUNNER_TEMP/runtime-manifest/wrangles-runtime-manifest.json" schema/wrangle_runtime_manifest.json

      - name: Save Schema and Runtime Manifest as Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: schema
          path: |
            schema/schema.json
            schema/wrangle_runtime_manifest.json
            schema/wrangles-runtime-manifest.schema.json
          if-no-files-found: error

      - name: Save runtime manifest bundle as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: runtime-manifest
          path: ${{ runner.temp }}/runtime-manifest/
          if-no-files-found: error

  sync-runtime-manifest-preview:
    name: Sync runtime manifest preview
    runs-on: ubuntu-latest
    needs: [test-generate-schema, build]
    # Temporary delivery test for this same-repository PR branch only.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'generate-and-publish-a-versioned-runtime-manifest-for-every-WranglesPY-release'
    permissions:
      contents: read
    steps:
      - name: Download validated runtime manifest
        uses: actions/download-artifact@v6
        with:
          name: runtime-manifest
          path: ${{ runner.temp }}/runtime-manifest

      - name: Verify runtime manifest checksum
        working-directory: ${{ runner.temp }}/runtime-manifest
        run: sha256sum --check wrangles-runtime-manifest.json.sha256

      - name: Create runtime manifest publishing token
        id: manifest-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: wrangleworks
          repositories: Wrangles-Docs
          permission-contents: write

      - name: Checkout Wrangles-Docs
        uses: actions/checkout@v5
        with:
          repository: wrangleworks/Wrangles-Docs
          ref: main
          token: ${{ steps.manifest-token.outputs.token }}
          path: runtime-docs

      - name: Select runtime manifest preview branch
        working-directory: runtime-docs
        run: |
          BRANCH_REF=$(git ls-remote --heads origin refs/heads/test_deploying_manifest)
          if [[ -n "$BRANCH_REF" ]]; then
            git fetch origin refs/heads/test_deploying_manifest
            git checkout -B test_deploying_manifest FETCH_HEAD
          else
            git checkout -b test_deploying_manifest
          fi

      - name: Copy runtime manifest preview to Wrangles-Docs
        working-directory: runtime-docs
        run: |
          mkdir -p registry/runtime
          cp "$RUNNER_TEMP/runtime-manifest/wrangles-runtime-manifest.json" registry/runtime/wranglespy.json
          cd registry/runtime
          sha256sum wranglespy.json > wranglespy.json.sha256

      - name: Commit and push runtime manifest preview
        working-directory: runtime-docs
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          test "$(git branch --show-current)" = test_deploying_manifest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/runtime/wranglespy.json registry/runtime/wranglespy.json.sha256
          if git diff --cached --quiet; then
            echo "No changes to the runtime manifest, skipping commit."
          else
            git commit -m "Update runtime manifest preview from WranglesPY ${SOURCE_REVISION}"
            git push origin HEAD:refs/heads/test_deploying_manifest
          fi

  build:
    runs-on: ubuntu-latest
    needs: [config, pytest, test-pip-install, test-generate-schema]
    if: needs.config.outputs.run_build == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      # Login against a Docker registry only when pushing
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: needs.config.outputs.push_image == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push the CI test image with Buildx (build only, never push, on PRs)
      # https://github.com/docker/build-push-action
      - name: Build and push CI test image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: ${{ needs.config.outputs.push_image != 'true' }}
          push: ${{ needs.config.outputs.push_image == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.config.outputs.build_tag }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Validate pull request test image
        if: needs.config.outputs.push_image != 'true'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.config.outputs.build_tag }}
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            "$IMAGE" \
            python /workspace/scripts/container_smoke.py
          docker run --rm "$IMAGE" python -m pip check
          docker run --rm "$IMAGE" python -m pip freeze
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace/tests/samples \
            "$IMAGE" \
            sh -c 'wrangles.recipe recipe-basic.wrgl.yml && wrangles.recipe recipe_custom_function.wrgl.yml -f custom_functions.py'

  test-container:
    runs-on: ubuntu-latest
    if: needs.config.outputs.push_image == 'true'
    needs: [config, build]
    container:
      image: ghcr.io/wrangleworks/wrangles:${{ needs.config.outputs.build_tag }}
    env:
      WRANGLES_USER: ${{ secrets.WRANGLES_USER }}
      WRANGLES_PASSWORD: ${{ secrets.WRANGLES_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Remove wrangles folder
        run: rm -r wrangles

      - name: Validate CI test runtime
        run: |
          python scripts/container_smoke.py
          python -m pip check
          python -m pip freeze

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==9.0.2 lorem pytest-mock jsonschema==4.26.0

      - name: Run Tests
        run: pytest

      - name: Run Recipe (Remote)
        run: wrangles.recipe 42f319a8-0849-4177

      - name: Run Recipe (Local)
        run: >-
          cd tests/samples
          && wrangles.recipe recipe-basic.wrgl.yml
          && wrangles.recipe recipe_custom_function.wrgl.yml -f custom_functions.py

  # Moves :dev / :latest onto the CI test image that test-container validated.
  # Retagging by digest guarantees the promoted image is the tested one and not
  # a rebuild, so no consumer of a mutable tag ever sees an untested image.
  promote-image:
    name: Promote CI Test Image
    runs-on: ubuntu-latest
    if: needs.config.outputs.push_image == 'true'
    needs: [config, build, test-container]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag tested image as ${{ needs.config.outputs.release_tag }}
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG}" \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          RELEASE_TAG: ${{ needs.config.outputs.release_tag }}
          DIGEST: ${{ needs.build.outputs.digest }}
