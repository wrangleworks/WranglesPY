version: 3

# Pilot operations select defaults under callers. Unmigrated operations retain v2 roles.
providers:
  openai:
    endpoints:
      responses: https://api.openai.com/v1/responses
      chat_completions: https://api.openai.com/v1/chat/completions
      embeddings: https://api.openai.com/v1/embeddings
    documentation:
      model_cards: https://developers.openai.com/api/docs/models

    models:
      gpt-6-luna:
        status: active
        applications: [data_extraction, description_writing]
        default_for: [global, test, extract.ai, generate.ai]
        defaults:
          reasoning:
            effort: none
          text:
            verbosity: low
        supported_values:
          reasoning.effort: [none, low, medium, high, xhigh, max]
          text.verbosity: [low, medium, high]

      gpt-6-sol:
        status: active
        applications: [reasoning, agents]
        default_for: []
        defaults:
          reasoning:
            effort: none
          text:
            verbosity: low
        supported_values:
          reasoning.effort: [none, low, medium, high, xhigh, max]
          text.verbosity: [low, medium, high]

      text-embedding-3-small:
        applications: [embeddings]
        status: active
        default_for: [embeddings]
      text-embedding-3-large:
        applications: [embeddings]
        status: active
        default_for: []

      # Older OpenAI models; status records each model's catalog lifecycle.
      gpt-5.4-mini:
        status: deprecated
        default_for: []
        defaults:
          reasoning:
            effort: none
          text:
            verbosity: low
      gpt-4o:
        status: deprecated
        default_for: []
        protocol_defaults:
          chat_completions:
            temperature: 0.2
        supported_values:
          reasoning.effort: []
          text.verbosity: []
      gpt-4o-mini:
        status: active
        default_for: []
        protocol_defaults:
          chat_completions:
            temperature: 0.2
        supported_values:
          reasoning.effort: []
          text.verbosity: []

  google:
    endpoints:
      # The SDK adds /{api_version}/models/{model}:generateContent.
      base_url: https://generativelanguage.googleapis.com
    documentation:
      model_cards: https://deepmind.google/models/model-cards/
    models:
      gemini-3.5-flash:
        status: active
        applications: [url_retrieval]
        default_for: [search.retrieve_link_content]
        defaults:
          thinking_level: minimal
        supported_values:
          thinking_level: [minimal, low, medium, high]
      gemini-3.6-flash:
        status: active
        applications: [url_retrieval]
        default_for: []
        defaults:
          thinking_level: minimal
        supported_values:
          thinking_level: [minimal, low, medium, high]
      gemini-3-flash-preview:
        status: active
        applications: [url_retrieval]
        default_for: []
        defaults:
          thinking_level: minimal
        supported_values:
          thinking_level: [minimal, low, medium, high]
      gemini-3.8-flash:
        status: active
        applications: [url_retrieval]
        default_for: []
        defaults:
          thinking_level: low
        supported_values:
          thinking_level: [low, medium, high]
  jina:
    endpoints:
      embeddings: https://api.jina.ai/v1/embeddings
    documentation:
      model_cards: https://jina.ai/models
    # Existing Jina callers supply their model explicitly.
    models:
      jina-embeddings-v5-omni-small:
        status: active
        applications: [embeddings]
        default_for: []
        defaults:
          # Jina's default for general similarity; retrieval callers override it.
          task: text-matching
        supported_values:
          task: [retrieval.query, retrieval.passage, text-matching, clustering, classification]

  typesafe:
    apis:
      systemone:
        endpoint: https://api.typesafe.ai/v1/systemone
    documentation:
      api: https://docs.typesafe.ai/introduction
    models:
      jev-1.13.0:
        status: active
        apis: [systemone]
        applications: [classification, scoring, true_false]
        default_for: [ai.choose, ai.score, ai.true_false]

  microsoft:
    models:
      microsoft-decision-1:
        status: active
        applications: [classification, scoring, true_false]
        default_for: [ai.choose, ai.score, ai.true_false]
        routed_via:
          provider: openrouter
          api: decisions
          request_model: microsoft/microsoft-decision-1

  openrouter:
    apis:
      decisions:
        endpoint: https://openrouter.ai/api/alpha/decisions
    documentation:
      api: https://openrouter.ai/docs/api/api-reference/alphadecisions/submit-a-decisions-request
      model_cards: https://openrouter.ai/microsoft/microsoft-decision-1

  serpapi:
    apis:
      google:
        endpoint: https://serpapi.com/search
        fixed_query: {engine: google}
      google_ai_mode:
        endpoint: https://serpapi.com/search
        fixed_query: {engine: google_ai_mode}
        public_parameters: [gl, hl]
        parameter_schema:
          type: object
          properties:
            gl: {type: string}
            hl: {type: string}
          additionalProperties: true

  huggingface:
    endpoints:
      hf_inference: https://router.huggingface.co/hf-inference/models
    documentation:
      api: https://huggingface.co/docs/inference-providers/en/providers/hf-inference
    # The generic task wrangle requires an explicit model; no task-wide default.
    models: {}

  anthropic:
    # Reserved for a future adapter; no runtime support is implied.
    models: {}

operations:
  ai.choose:
    provider: typesafe
    protocol: systemone
    defaults:
      default_concurrency: 10
      request_timeout_seconds: 30
      retries: 1
      cache:
        enabled: false
        ttl_seconds: 3600
        max_entries: 512
        max_value_bytes: 65536
        single_flight: true
        log_every: 0
  ai.score:
    provider: typesafe
    protocol: systemone
    defaults:
      default_concurrency: 10
      request_timeout_seconds: 30
      retries: 1
      cache:
        enabled: false
        ttl_seconds: 3600
        max_entries: 512
        max_value_bytes: 65536
        single_flight: true
        log_every: 0
  ai.true_false:
    provider: typesafe
    protocol: systemone
    defaults:
      default_concurrency: 10
      request_timeout_seconds: 30
      retries: 1
      cache:
        enabled: false
        ttl_seconds: 3600
        max_entries: 512
        max_value_bytes: 65536
        single_flight: true
        log_every: 0
  ai.decisions:
    actions:
      wrangle.execute:
        compatible_apis:
          - {provider: typesafe, api: systemone}
          - {provider: openrouter, api: decisions}
        defaults:
          decimals: 2
          default_concurrency: 10
          request_timeout_seconds: 30
          retries: 1
          cache:
            enabled: false
            ttl_seconds: 3600
            max_entries: 512
            max_value_bytes: 65536
            single_flight: true
            log_every: 0
  search.ai_mode:
    actions:
      wrangle.execute:
        compatible_apis: [{provider: serpapi, api: google_ai_mode}]
        fixed_query: {output: md}
        defaults: {include_raw_response: false, default_concurrency: 10}
  extract.ai:
    provider: openai
    protocol: responses
    defaults:
      default_concurrency: 32
      request_timeout_seconds: 12
      retries: 1
      strict: true
      store: true # enables logging at openai
      cache:
        enabled: true
        ttl_seconds: 3600
        max_entries: 512
        max_value_bytes: 65536
        single_flight: true
        log_every: 100
      prompt:
        version: 2
        instructions: |-
          You are an expert data extraction assistant.
          Extract and standardize only the requested fields from the provided data.
          Use only the provided DATA. Do not invent missing values.
          Return null when the data does not explicitly support a requested field.
          For literal extracted strings, preserve concise source text and units unless the field asks for conversion.
          Return data that satisfies the supplied JSON schema exactly.
  generate.ai:
    provider: openai
    protocol: responses
    defaults:
      default_concurrency: 20
      request_timeout_seconds: 90
      retries: 1
      strict: true
      recipe_strict: false
  embeddings:
    provider: openai
    protocol: embeddings
    defaults:
      default_concurrency: 10
      request_timeout_seconds: 30
      retries: 1
      batch_size: 100
      precision: float32
  search.retrieve_link_content:
    provider: google
    protocol: generate_content
    defaults:
      api_version: v1beta
      default_concurrency: 10
      request_timeout_seconds: 10
      retries: 0
  huggingface:
    provider: huggingface
    protocol: hf_inference
    requires_model: true
    defaults:
      request_timeout_seconds: 30
      retries: 1

callers:
  wranglespy:
    operations:
      ai.decisions:
        actions:
          wrangle.execute:
            default_selection: {provider: typesafe, api: systemone, model: jev-1.13.0}
      search.ai_mode:
        actions:
          wrangle.execute:
            default_selection: {provider: serpapi, api: google_ai_mode}
