  google:
    endpoints:
      # The SDK adds /{api_version}/models/{model}:generateContent.
      base_url: https://generativelanguage.googleapis.com
    documentation:
      model_cards: https://deepmind.google/models/model-cards/
    models:
      gemini-3.5-flash:
        status: active
        applications: [url_retrieval]
        default_for: [search.retrieve_link_content]
        defaults:
          thinking_level: minimal
        supported_values:
          thinking_level: [minimal, low, medium, high]
      gemini-3.6-flash:
        status: active
        applications: [url_retrieval]
        default_for: []
        defaults:
          thinking_level: minimal
        supported_values:
          thinking_level: [minimal, low, medium, high]
      gemini-3-flash-preview:
        status: active
        applications: [url_retrieval]
        default_for: []
        defaults:
          thinking_level: minimal
        supported_values:
          thinking_level: [minimal, low, medium, high]
      gemini-3.8-flash:
        status: active
        applications: [url_retrieval]
        default_for: []
        defaults:
          thinking_level: low
        supported_values:
          thinking_level: [low, medium, high]
  jina:
    endpoints:
      embeddings: https://api.jina.ai/v1/embeddings
    documentation:
      model_cards: https://jina.ai/models
    # Existing Jina callers supply their model explicitly.
    models:
      jina-embeddings-v5-omni-small:
        status: active
        applications: [embeddings]
        default_for: []
        defaults:
          # Jina's default for general similarity; retrieval callers override it.
          task: text-matching
        supported_values:
          task: [retrieval.query, retrieval.passage, text-matching, clustering, classification]

  typesafe:
    endpoints:
      systemone: https://api.typesafe.ai/v1/systemone
    documentation:
      api: https://docs.typesafe.ai/introduction
    models:
      jev-1.13.0:
        status: active
        applications: [classification, scoring, true_false]
        default_for: [ai.choose, ai.score, ai.true_false, ai.answers]

  huggingface:
    endpoints:
      hf_inference: https://router.huggingface.co/hf-inference/models
    documentation:
      api: https://huggingface.co/docs/inference-providers/en/providers/hf-inference
    # The generic task wrangle requires an explicit model; no task-wide default.
    models: {}

  anthropic:
    # Reserved for a future adapter; no runtime support is implied.
    models: {}

operations:
  ai.choose:
    provider: typesafe
    protocol: systemone
    defaults:
      default_concurrency: 10
      request_timeout_seconds: 30
      retries: 1
      cache:
        enabled: false
        ttl_seconds: 3600
        max_entries: 512
        max_value_bytes: 65536
        single_flight: true
        log_every: 0
  ai.score:
    provider: typesafe
    protocol: systemone
    defaults:
      default_concurrency: 10
      request_timeout_seconds: 30
      retries: 1
      cache:
        enabled: false
        ttl_seconds: 3600
        max_entries: 512
        max_value_bytes: 65536
        single_flight: true
        log_every: 0
  ai.true_false:
    provider: typesafe
    protocol: systemone
    defaults:
      default_concurrency: 10
      request_timeout_seconds: 30
      retries: 1
      cache:
        enabled: false
        ttl_seconds: 3600
        max_entries: 512
        max_value_bytes: 65536
        single_flight: true
        log_every: 0
  ai.answers:
    provider: typesafe
    protocol: systemone
    defaults:
      default_concurrency: 10
      request_timeout_seconds: 30
      retries: 1
      cache:
        enabled: false
        ttl_seconds: 3600
        max_entries: 512
        max_value_bytes: 65536
        single_flight: true
        log_every: 0
  extract.ai:
    provider: openai
    protocol: responses
    defaults:
      default_concurrency: 32
      request_timeout_seconds: 12
      retries: 1
      strict: true
      store: true # enables logging at openai
      cache:
        enabled: true
        ttl_seconds: 3600
        max_entries: 512
        max_value_bytes: 65536
        single_flight: true
        log_every: 100
      prompt:
        version: 2
        instructions: |-
          You are an expert data extraction assistant.
          Extract and standardize only the requested fields from the provided data.
          Use only the provided DATA. Do not invent missing values.
          Return null when the data does not explicitly support a requested field.
          For literal extracted strings, preserve concise source text and units unless the field asks for conversion.
          Return data that satisfies the supplied JSON schema exactly.
  generate.ai:
    provider: openai
    protocol: responses
    defaults:
      default_concurrency: 20
      request_timeout_seconds: 90
      retries: 1
      strict: true
      recipe_strict: false
  embeddings:
    provider: openai
    protocol: embeddings
    defaults:
      default_concurrency: 10
      request_timeout_seconds: 30
      retries: 1
      batch_size: 100
      precision: float32
  search.retrieve_link_content:
    provider: google
    protocol: generate_content
    defaults:
      api_version: v1beta
      default_concurrency: 10
      request_timeout_seconds: 10
      retries: 0
  huggingface:
    provider: huggingface
    protocol: hf_inference
    requires_model: true
    defaults:
      request_timeout_seconds: 30
      retries: 1
