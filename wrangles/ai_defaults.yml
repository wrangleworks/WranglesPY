version: 2

# Status describes lifecycle; default_for lists the independent default roles.
# The catalog records provider settings; it does not implement new adapters.
providers:
  openai:
    endpoints:
      responses: https://api.openai.com/v1/responses
      chat_completions: https://api.openai.com/v1/chat/completions
      embeddings: https://api.openai.com/v1/embeddings
    models:
      gpt-6-luna:
        status: active
        default_for: [global, test, extract.ai, generate.ai]
        defaults:
          reasoning:
            effort: none
          text:
            verbosity: low
        supported_values:
          reasoning.effort: [none, low, medium, high, xhigh, max]
          text.verbosity: [low, medium, high]
      gpt-5.4-mini:
        status: active
        default_for: []
        defaults:
          reasoning:
            effort: none
          text:
            verbosity: low
      text-embedding-3-small:
        status: active
        default_for: [embeddings]
      gpt-4o:
        status: active
        default_for: []
        protocol_defaults:
          chat_completions:
            temperature: 0.2
        supported_values:
          reasoning.effort: []
          text.verbosity: []
      gpt-4o-mini:
        status: active
        default_for: []
        protocol_defaults:
          chat_completions:
            temperature: 0.2
        supported_values:
          reasoning.effort: []
          text.verbosity: []
  google:
    models:
      models/gemini-3-flash-preview:
        status: active
        default_for: [search.retrieve_link_content]
        defaults:
          temperature: 0.1
  jina:
    endpoints:
      embeddings: https://api.jina.ai/v1/embeddings
    # Existing Jina callers supply their model explicitly.
    models: {}
  anthropic:
    # Reserved for a future adapter; no runtime support is implied.
    models: {}

operations:
  extract.ai:
    provider: openai
    protocol: responses
    defaults:
      profile: extract_fast
      default_concurrency: 32
      request_timeout_seconds: 12
      retries: 1
      strict: true
      store: true # enables logging at openai
      cache:
        enabled: true
        ttl_seconds: 3600
        max_entries: 512
        max_value_bytes: 65536
        single_flight: true
        log_every: 100
      prompt:
        version: 2
        instructions: |-
          You are an expert data extraction assistant.
          Extract and standardize only the requested fields from the provided data.
          Use only the provided DATA. Do not invent missing values.
          Return null when the data does not explicitly support a requested field.
          For literal extracted strings, preserve concise source text and units unless the field asks for conversion.
          Return data that satisfies the supplied JSON schema exactly.
  generate.ai:
    provider: openai
    protocol: responses
    defaults:
      default_concurrency: 20
      request_timeout_seconds: 90
      retries: 1
      strict: true
      recipe_strict: false
      reasoning:
        effort: low
  embeddings:
    provider: openai
    protocol: embeddings
    defaults:
      default_concurrency: 10
      request_timeout_seconds: 30
      retries: 1
      batch_size: 100
      precision: float32
  search.retrieve_link_content:
    provider: google
    protocol: generate_content
    defaults:
      default_concurrency: 10
      request_timeout_seconds: 45
      retries: 1
