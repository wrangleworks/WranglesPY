# Supply products.json as the input dataframe; run.py does this for you.
# The current TYPESAFE_API_KEY environment variable supplies credentials.
wrangles:
  - ai.score:
      input: Description
      cache: false
      threads: 1
      timeout: 30
      retries: 0
      questions:
        category_fit:
          for_each:
            values: CandidateCategories  # Column containing a dictionary per row.
            variable: category
          instructions: &category_instructions >-
            How strongly does the description support the category "{{ category }}"
            at its stated specificity? The manufacturer is "{{ Manufacturer_Name }}".
            Distinguish missing information from contradictory information.
            Do not assume an unstated material, function, or intended use.
          criteria: &category_criteria
            - >-
              Contradicted: The description identifies a different product type
              or conflicts with a defining category requirement.
            - >-
              Weakly supported: There is no contradiction, but only generic details
              match; the category's main product type or use is not established.
            - >-
              Supported but incomplete: The main product type or use matches
              without contradiction, but a detail needed to confirm this specific
              category is missing.
            - >-
              Clearly supported: The description establishes the category at its
              stated specificity, with no material ambiguity or contradictory detail.
        list_fit:
          for_each:
            values: CandidateList  # Column containing a simple list per row.
            variable: category
          instructions: *category_instructions
          criteria: *category_criteria

  # First expose each dictionary wrapper from the result list.
  - split.list:
      input: category_fit
      output: candidate_answer_*

  # This example has at most three candidates. split.list pads shorter lists
  # with empty strings; use an empty JSON dictionary for those padded slots.
  # Also create missing slots when the selected input has fewer candidates.
  - create.column:
      output: [candidate_answer_1, candidate_answer_2, candidate_answer_3]
      value: "{}"
      value_if_exists: coalesce

  # Merge the wrappers by semantic key, independent of candidate order.
  - split.dictionary:
      input: [candidate_answer_1, candidate_answer_2, candidate_answer_3]
      default:
        category_1: {}
        category_2: {}
        category_3: {}

  # Then expose each answer's fields, retaining its semantic key as a prefix.
  # Keep probabilities as one dictionary rather than splitting rubric text.
  - split.dictionary:
      input: category_1
      default: &empty_answer
        value: ""
        score: null
        confidence: null
        probabilities: {}
      output:
        - "*": category_1_*
  - split.dictionary:
      input: category_2
      default: *empty_answer
      output:
        - "*": category_2_*
  - split.dictionary:
      input: category_3
      default: *empty_answer
      output:
        - "*": category_3_*

  - select.columns:
      input:
        - Description
        - Manufacturer Name
        - CandidateCategories
        - CandidateList
        - category_fit
        - list_fit
        - category_1_*
        - category_2_*
        - category_3_*
